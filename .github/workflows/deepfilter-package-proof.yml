name: Verify complete DeepFilterNet APK packaging
on:
  push:
    branches: [feature/deepfilternet-calls]
    paths: ['.github/workflows/deepfilter-package-proof.yml', 'tools/deepfilter/finalize_models.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: molly-deepfilter-native-arm64
          run-id: 37036471463
          github-token: ${{ github.token }}
          path: out/native
      - uses: actions/download-artifact@v4
        with:
          name: deepfilter-android-reference-inputs
          run-id: 36929152476
          github-token: ${{ github.token }}
          path: out/reference
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - name: Prepare verification environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user e2fsprogs
          sdkmanager 'ndk;28.0.13004108' 'build-tools;36.0.0'
          mkdir -p out/package-reports out/final-apk
      - name: Wait for the exact compiled build artifact, not a different branch
        id: compiled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          base='repos/mekromn/mollyim-android/actions/runs/37044322354'
          for attempt in range(45):
              run=json.loads(subprocess.check_output(['gh','api',base]))
              assert run['head_sha']=='377f20c5cb5394762e6efa41e5ba8a8b3b75f76c'
              records=json.loads(subprocess.check_output(['gh','api',base+'/artifacts']))['artifacts']
              matches=[a for a in records if a['name'] in ('molly-deepfilter-release-unsigned','molly-deepfilter-unverified-build-debug')]
              if matches:
                  assert len(matches)==1 and not matches[0]['expired']
                  Path('out/package-reports/build-artifact.json').write_text(json.dumps(matches[0],indent=2))
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('artifact='+matches[0]['name']+'\n')
                  break
              if run['status']=='completed':raise RuntimeError('Build ended without an APK artifact')
              time.sleep(20)
          else:raise RuntimeError('Bounded wait expired before the compiled artifact was available')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.compiled.outputs.artifact }}
          run-id: 37044322354
          github-token: ${{ github.token }}
          path: out/compiled
      - name: Prove model finalization and preserve the compiled input inventory
        env:
          DEEPFILTER_MODELS: ${{ github.workspace }}/out/reference/models
        run: |
          set -o pipefail
          python3 tools/deepfilter/test_finalize_models.py 2>&1 | tee out/package-reports/finalizer-tests.log
          python3 tools/deepfilter/test_release.py 2>&1 | tee out/package-reports/verifier-tests.log
          python3 - <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'tools/deepfilter')
          from verify_release import verify_inputs
          verify_inputs(Path('.'),json.loads(Path('out/native/native-inputs.json').read_text()))
          apks=list(Path('out/compiled').rglob('*.apk'));assert len(apks)==1
          with zipfile.ZipFile(apks[0]) as z:
              inventory={n:{'size':z.getinfo(n).file_size,'sha256':hashlib.sha256(z.read(n)).hexdigest()} for n in z.namelist() if n.startswith('assets/deepfilter/') or n.endswith('.dex') or n=='resources.arsc'}
          Path('out/package-reports/compiled-inventory.json').write_text(json.dumps(inventory,indent=2))
          Path('out/compiled-apk-path.txt').write_text(str(apks[0]))
          PY
          python3 tools/deepfilter/finalize_models.py --input "$(cat out/compiled-apk-path.txt)" --output out/model-complete.apk --models out/reference/models > out/package-reports/model-finalization.json
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 out/model-complete.apk out/final-apk/Molly-Audio-DeepFilterNet-arm64-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 out/final-apk/Molly-Audio-DeepFilterNet-arm64-unsigned.apk
      - name: Verify every compiled native method, model, library and update identifier
        run: |
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          python3 tools/deepfilter/verify_release.py --apk out/final-apk/Molly-Audio-DeepFilterNet-arm64-unsigned.apk --aar out/native/ringrtc-deepfilter-arm64.aar --aapt2 "$SDK/aapt2" --dexdump "$SDK/dexdump" > out/package-reports/apk-verification.json
      - name: Execute the actual finalized APK runtime under Android ARM64 Bionic
        run: |
          set -o pipefail
          mkdir -p out/arm64-execution
          bash tools/deepfilter/qemu_runtime.sh out/final-apk/Molly-Audio-DeepFilterNet-arm64-unsigned.apk out/reference 2>&1 | tee out/arm64-execution/execution.log
      - uses: actions/upload-artifact@v4
        with:
          name: molly-deepfilter-complete-unsigned
          path: out/final-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molly-deepfilter-complete-verification
          path: |
            out/package-reports/
            out/arm64-execution/*.json
            out/arm64-execution/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: molly-deepfilter-packaging-diagnostics
          path: out/final-apk/
          if-no-files-found: ignore
