name: Incoming call audio
on:
  push:
    branches: [feature/incoming-call-audio]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: incoming-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: DSP regression and sanitizer tests
        run: |
          bash tools/incoming-audio/test_host.sh
          python3 tools/incoming-audio/test_build_driver.py
  release-arm64:
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: '4'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - name: Prepare ephemeral runner for native compilation
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/local/swift
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake protobuf-compiler libglib2.0-dev pkg-config
          sdkmanager 'ndk;28.0.13004108' 'build-tools;36.0.0' 'platforms;android-36.1'
          df -h .
      - name: Export SDK signing tool for offline signing
        run: |
          mkdir -p out/signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/signing-tools/
          sha256sum out/signing-tools/apksigner.jar > out/signing-tools/apksigner.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tool
          path: out/signing-tools/
          if-no-files-found: error
      - name: Restore verified native artifact
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: out/incoming-audio/
          key: incoming-audio-arm64-v1-${{ hashFiles('native/incoming-audio/**', 'tools/incoming-audio/build_native.sh', 'tools/incoming-audio/patch_ringrtc.py', 'tools/incoming-audio/verify_aar.py') }}
      - name: Restore prepared WebRTC workspace
        id: source-cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/molly-incoming-audio
          key: molly-prepared-ubuntu24-7778d-v1-57d50b8656bfed9e42adf8de1d549ba4229cc909
      - name: Prepare pinned native workspace
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/build-logs
          set -o pipefail
          bash tools/incoming-audio/build_native.sh prepare 2>&1 | tee out/build-logs/native-prepare.log
      - name: Cache unmodified prepared workspace before compilation
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/molly-incoming-audio
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Build patched RingRTC and verify exported native ABI
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/build-logs
          set -o pipefail
          bash tools/incoming-audio/build_native.sh build 2>&1 | tee out/build-logs/native-build.log
      - name: Verify native artifact before packaging
        run: python3 tools/incoming-audio/verify_aar.py out/incoming-audio/ringrtc-incoming-audio-arm64.aar
      - name: Cache verified native artifact
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/incoming-audio/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Preserve native build evidence
        uses: actions/upload-artifact@v4
        with:
          name: incoming-audio-native-arm64
          path: out/incoming-audio/
          if-no-files-found: error
      - uses: gradle/actions/setup-gradle@v6
      - name: Build coexistence release APK
        env:
          INCOMING_AUDIO_AAR: ${{ github.workspace }}/out/incoming-audio/ringrtc-incoming-audio-arm64.aar
        run: |
          chmod +x gradlew
          mkdir -p out/build-logs
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 -I tools/incoming-audio/native_override.gradle -PbasePackageId=com.mekromn.mollyaudio -PbaseAppTitle="Molly Audio" -PbaseAppFileName=Molly-Audio :app:assembleProdStoreRelease 2>&1 | tee out/build-logs/app-build.log
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: molly-incoming-audio-arm64-unsigned
          path: app/build/outputs/apk/prodStore/release/*.apk
          if-no-files-found: error
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: incoming-audio-build-reports
          path: |
            app/build/reports/
            out/build-logs/
            out/incoming-audio/*.json
            out/incoming-audio/*.txt
