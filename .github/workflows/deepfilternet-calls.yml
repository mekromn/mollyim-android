name: Molly Audio DeepFilterNet
on:
  push:
    branches: [feature/deepfilternet-calls]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepfilter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  settings-and-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Existing audio and AMOLED baseline regressions
        run: |
          bash tools/incoming-audio/test_host.sh
          python3 tools/amoled/test_theme.py
      - name: Provenance validation and verified build-time assets
        run: |
          python3 tools/deepfilter/test_provenance.py
          python3 tools/deepfilter/prepare_models.py --output out/deepfilter-inputs/models
          python3 tools/deepfilter/prepare_test_inputs.py --output out/deepfilter-inputs/fixtures
      - name: Run real JUnit independent-settings tests
        run: bash tools/deepfilter/test_settings.sh
      - name: Preserve verified inputs for native inference tests
        uses: actions/upload-artifact@v4
        with:
          name: deepfilter-verified-inputs
          path: out/deepfilter-inputs/
          if-no-files-found: error
