name: DeepFilterNet development snapshot
on:
  push:
    branches: [feature/deepfilternet-calls]
    paths: ['.github/workflows/deepfilter-dev-snapshot.yml', 'native/call-denoise/**', 'docs/deepfilternet-progress.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export tracked source and history
        run: |
          mkdir -p out/dev-snapshot
          git archive --format=tar.gz HEAD > out/dev-snapshot/source.tar.gz
          git rev-parse HEAD > out/dev-snapshot/revision.txt
          git log -40 --format='%H %s' > out/dev-snapshot/history.txt
          git ls-tree -r HEAD > out/dev-snapshot/tree.txt
          git diff b89c53117079099de3c910e27702046d3a74a279 HEAD --stat > out/dev-snapshot/change-summary.txt
          sha256sum out/dev-snapshot/source.tar.gz > out/dev-snapshot/source.sha256
      - name: Export pinned WebRTC source for converter tests
        run: |
          git clone --filter=blob:none --depth 1 --branch 7778d https://github.com/mollyim/webrtc.git "$RUNNER_TEMP/webrtc-audit"
          test "$(git -C "$RUNNER_TEMP/webrtc-audit" rev-parse HEAD)" = 63074e7b349aff7cc6d7ff46d4f1dd3101077242
          git -C "$RUNNER_TEMP/webrtc-audit" archive --format=tar.gz HEAD common_audio api/audio audio rtc_base system_wrappers > "$RUNNER_TEMP/webrtc-source.tar.gz"
          tar -tzf "$RUNNER_TEMP/webrtc-source.tar.gz" > /dev/null
          mv "$RUNNER_TEMP/webrtc-source.tar.gz" out/dev-snapshot/
          sha256sum out/dev-snapshot/webrtc-source.tar.gz > out/dev-snapshot/webrtc-source.sha256
      - name: Export pinned RingRTC sources for call gate integration
        run: |
          git clone --depth 1 --branch v2.69.5-1 https://github.com/mollyim/ringrtc.git "$RUNNER_TEMP/ringrtc-audit"
          test "$(git -C "$RUNNER_TEMP/ringrtc-audit" rev-parse refs/tags/v2.69.5-1)" = e05d1475a96806acad749da8030ea4b73cc5fdb4
          git -C "$RUNNER_TEMP/ringrtc-audit" archive --format=tar.gz HEAD > out/dev-snapshot/ringrtc-source.tar.gz
          git -C "$RUNNER_TEMP/ringrtc-audit" rev-parse HEAD > out/dev-snapshot/ringrtc-revision.txt
          sha256sum out/dev-snapshot/ringrtc-source.tar.gz > out/dev-snapshot/ringrtc-source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfilter-dev-source
          path: out/dev-snapshot/
          if-no-files-found: error
