name: Mock Call Lab packaged ARM64 runtime proof
on:
  push:
    branches: [feature/mock-call-lab]
    paths:
      - '.github/workflows/mock-call-runtime-proof.yml'
      - 'tools/mock-call/verify_apk.py'
      - 'tools/mock-call/test_apk_verifier.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  packaged-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Establish exact repaired app build
        env:
          GH_TOKEN: ${{ github.token }}
          APP_RUN: '37136793888'
          APP_SOURCE: 'fd020c11b4ef25cf1cf75d079ec9d8879e98696c'
        run: |
          set -euo pipefail
          mkdir -p out/mock-runtime-proof
          for n in $(seq 1 180); do
            gh api "repos/mekromn/mollyim-android/actions/runs/$APP_RUN" > out/mock-runtime-proof/app-run.json
            status=$(python3 -c 'import json;print(json.load(open("out/mock-runtime-proof/app-run.json"))["status"])')
            if [ "$status" = completed ]; then break; fi
            sleep 10
          done
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          run=json.loads(Path('out/mock-runtime-proof/app-run.json').read_text())
          assert run['id']==int(os.environ['APP_RUN'])
          assert run['head_sha']==os.environ['APP_SOURCE']
          assert run['status']=='completed' and run['conclusion']=='success'
          jobs=json.loads(subprocess.check_output(['gh','api',f"repos/mekromn/mollyim-android/actions/runs/{run['id']}/jobs"]))['jobs']
          steps={j['name']:{s['name']:s['conclusion'] for s in (j.get('steps') or [])} for j in jobs}
          assert next(j for j in jobs if j['name']=='source-check')['conclusion']=='success'
          apk=next(j for j in jobs if j['name']=='apk')
          assert apk['conclusion']=='success'
          assert steps['apk']['Compile, lint and assemble actual optimized Android app']=='success'
          assert steps['apk']['Verify compiled APK and local-only entry']=='success'
          arts=json.loads(subprocess.check_output(['gh','api',f"repos/mekromn/mollyim-android/actions/runs/{run['id']}/artifacts"]))['artifacts']
          names={a['name'] for a in arts}
          assert {'molly-mock-call-lab-unsigned','molly-mock-sdk-tools','mock-call-app-build-reports'}<=names
          Path('out/mock-runtime-proof/build-origin.json').write_text(json.dumps({'run':run['id'],'head_sha':run['head_sha'],'artifacts':arts,'steps':steps},indent=2))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: molly-mock-call-lab-unsigned
          run-id: 37136793888
          github-token: ${{ github.token }}
          path: out/compiled
      - uses: actions/download-artifact@v4
        with:
          name: molly-mock-sdk-tools
          run-id: 37136793888
          github-token: ${{ github.token }}
          path: out/sdk
      - uses: actions/download-artifact@v4
        with:
          name: molly-mock-native-arm64
          run-id: 37104079175
          github-token: ${{ github.token }}
          path: out/native
      - uses: actions/download-artifact@v4
        with:
          name: deepfilter-android-reference-inputs
          run-id: 36929152476
          github-token: ${{ github.token }}
          path: out/reference
      - name: Re-run full package checks against repaired native engine
        run: |
          set -euo pipefail
          set -o pipefail
          apk=$(find out/compiled -type f -name '*.apk' -print -quit)
          test -n "$apk"
          export LD_LIBRARY_PATH="$PWD/out/sdk/lib64"
          chmod +x out/sdk/aapt2 out/sdk/dexdump out/sdk/zipalign
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/deepfilter')
          from verify_release import verify_inputs
          verify_inputs(Path('.'),json.loads(Path('out/native/native-inputs.json').read_text()))
          PY
          python3 tools/mock-call/test_apk_verifier.py 2>&1 | tee out/mock-runtime-proof/verifier-tests.log
          python3 tools/mock-call/verify_apk.py --apk "$apk" --aar out/native/ringrtc-mock-arm64.aar --sdk out/sdk > out/mock-runtime-proof/apk-verification.json
          out/sdk/zipalign -c -P 16 4 "$apk"
          sha256sum "$apk" > out/mock-runtime-proof/input-apk.sha256
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android ARM64 execution environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user e2fsprogs
          sdkmanager 'ndk;28.0.13004108'
      - name: Execute exact APK models with Android Bionic
        run: |
          set -euo pipefail
          set -o pipefail
          apk=$(find out/compiled -type f -name '*.apk' -print -quit)
          bash tools/deepfilter/qemu_runtime.sh "$apk" out/reference 2>&1 | tee out/mock-runtime-proof/execution.log
          printf '%s\n' 'Android ARM64 ELF inference with Bionic under QEMU user mode. NOT Android UI, physical microphone routing, or a live-call test.' > out/mock-runtime-proof/test-boundaries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: molly-mock-call-lab-171908-verified-unsigned
          path: out/compiled/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-call-171908-packaged-runtime-proof
          path: |
            out/mock-runtime-proof/
            out/arm64-execution/*.json
            out/arm64-execution/*.log
          if-no-files-found: error
