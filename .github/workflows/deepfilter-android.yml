name: DeepFilterNet Android ARM64
on:
  push:
    branches: [feature/deepfilternet-calls]
    paths: ['native/deepfilter-runtime/**', 'tools/deepfilter/build_runtime.sh', 'tools/deepfilter/verify_runtime.py', '.github/workflows/deepfilter-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepfilter-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '4'
      DF_TEST_MODELS: ${{ github.workspace }}/out/reference/models
      DF_TEST_FIXTURE: ${{ github.workspace }}/out/fixtures/noisy_snr0.wav
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/deepfilter-runtime/target
          key: deepfilter-rust188-reference-v1-${{ hashFiles('native/deepfilter-runtime/Cargo.lock') }}
          restore-keys: deepfilter-rust188-host-v1-
      - name: Verified models and independent upstream reference vectors
        run: |
          python3 tools/deepfilter/prepare_models.py --output out/reference/models
          python3 tools/deepfilter/prepare_test_inputs.py --output out/fixtures
          cargo +1.88.0 test --release --locked --manifest-path native/deepfilter-runtime/Cargo.toml -- --test-threads=1
          cargo +1.88.0 run --release --locked --manifest-path native/deepfilter-runtime/Cargo.toml --example reference_export -- out/reference/vectors
          git rev-parse HEAD > out/reference/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deepfilter-android-reference-inputs
          path: out/reference/
          if-no-files-found: error
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - name: Pinned compiler and Android NDK
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          sdkmanager 'ndk;28.0.13004108'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/deepfilter-runtime/target
          key: deepfilter-rust188-arm64-v1-${{ hashFiles('native/deepfilter-runtime/Cargo.lock') }}
      - name: Build Android ARM64 runtime and verify actual ELF
        run: |
          mkdir -p out/runtime-android
          set -o pipefail
          bash tools/deepfilter/build_runtime.sh 2>&1 | tee out/runtime-android/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepfilter-runtime-android-arm64
          path: out/runtime-android/
          if-no-files-found: error
