name: DeepFilterNet native runtime
on:
  push:
    branches: [feature/deepfilternet-calls]
    paths: ['native/deepfilter-runtime/**', 'tools/deepfilter/**', '.github/workflows/deepfilter-runtime.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: deepfilter-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      CARGO_BUILD_JOBS: '4'
      DF_TEST_MODELS: ${{ github.workspace }}/out/deepfilter-inputs/models
      DF_TEST_FIXTURE: ${{ github.workspace }}/out/deepfilter-inputs/fixtures/noisy_snr0.wav
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/deepfilter-runtime/target
          key: deepfilter-rust188-host-v1-${{ hashFiles('native/deepfilter-runtime/Cargo.toml') }}
      - name: Verify public model and speech fixtures
        run: |
          python3 tools/deepfilter/prepare_models.py --output out/deepfilter-inputs/models
          python3 tools/deepfilter/prepare_test_inputs.py --output out/deepfilter-inputs/fixtures
      - name: Verify exact dependency lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/deepfilter/restore_runtime_lock.py
          mkdir -p out/runtime
          cp native/deepfilter-runtime/Cargo.lock out/runtime/
          cargo +1.88.0 metadata --locked --manifest-path native/deepfilter-runtime/Cargo.toml --format-version=1 > out/runtime/dependencies.json
      - name: Native ABI, failure, actual model and independent reference tests
        run: |
          set -o pipefail
          cargo +1.88.0 test --release --locked --manifest-path native/deepfilter-runtime/Cargo.toml -- --test-threads=1 --nocapture 2>&1 | tee out/runtime/tests.log
      - name: Build checked host C ABI
        run: |
          cargo +1.88.0 build --release --locked --manifest-path native/deepfilter-runtime/Cargo.toml
          cp native/deepfilter-runtime/target/release/libmolly_deepfilter.so out/runtime/
          git rev-parse HEAD > out/runtime/source-revision.txt
          sha256sum out/runtime/libmolly_deepfilter.so > out/runtime/library.sha256
      - name: Commit tested dependency lock on feature branch only
        if: github.ref == 'refs/heads/feature/deepfilternet-calls'
        run: |
          git config user.name 'Molly Audio native builder'
          git config user.email 'builder@localhost'
          git add native/deepfilter-runtime/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: pin tested DeepFilterNet native dependency lock'
            git push origin HEAD:feature/deepfilternet-calls
          fi
      - name: Cache dependency compilation even after red tests
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/deepfilter-runtime/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Preserve logs and exact lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepfilter-runtime-host
          path: out/runtime/
          if-no-files-found: error
