name: Mock Call Lab app and signed-update candidate
on:
  push:
    branches: [feature/mock-call-lab]
    paths:
      - '.github/workflows/mock-call-app.yml'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'tools/mock-call/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mock-call-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify checked-in application source without rewriting it
        run: |
          test "$GITHUB_REF" = refs/heads/feature/mock-call-lab
          mkdir -p out/mock-app-source
          set -o pipefail
          bash tools/mock-call/test_app.sh 2>&1 | tee out/mock-app-source/tests.log
          python3 tools/mock-call/test_apk_verifier.py 2>&1 | tee out/mock-app-source/apk-contracts.log
          git diff --check
          git rev-parse HEAD > out/mock-app-source/source-revision.txt
          git archive --format=tar.gz HEAD > out/mock-app-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-call-app-source-reports
          path: out/mock-app-source/
          if-no-files-found: error
  apk:
    needs: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: molly-mock-native-arm64
          # e1c58eb media-engine lifetime repair compiled from source in this run.
          run-id: 37164732324
          github-token: ${{ github.token }}
          path: out/native
      - uses: actions/download-artifact@v4
        with:
          name: deepfilter-android-reference-inputs
          run-id: 36929152476
          github-token: ${{ github.token }}
          path: out/reference
      - uses: actions/download-artifact@v4
        with:
          name: deepfilter-mobile-fused-model
          run-id: 37150609744
          github-token: ${{ github.token }}
          path: out/mobile-model
      - name: Verify actual native inputs and all bundled models
        run: |
          mkdir -p out/mock-app-reports
          python3 tools/mock-call/verify_native.py out/native/ringrtc-mock-arm64.aar > out/mock-app-reports/native.json
          python3 - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/deepfilter')
          from verify_release import verify_inputs
          from prepare_models import publish_asset
          verify_inputs(Path('.'),json.loads(Path('out/native/native-inputs.json').read_text()))
          lock=Path('tools/deepfilter/models.lock.json')
          for m in json.loads(lock.read_text())['models']:
              publish_asset((Path('out/reference/models')/m['asset']).read_bytes(),m,Path('app/src/main/assets/deepfilter')/m['asset'])
          (Path('app/src/main/assets/deepfilter')/'models.json').write_bytes(lock.read_bytes())

          mobile=json.loads(Path('tools/deepfilter/mobile-model.lock.json').read_text())
          derived=json.loads(Path('out/mobile-model/manifest-derived.json').read_text())
          for key in ('id','wire_id','asset','source_repository','source_revision','source_path','bytes','git_blob_sha1','sha256','meta'):
              if derived.get(key)!=mobile.get(key):
                  raise ValueError('Mobile model proof drift: '+key)
          payload=(Path('out/mobile-model')/mobile['asset']).read_bytes()
          if len(payload)!=mobile['bytes'] or hashlib.sha256(payload).hexdigest()!=mobile['sha256']:
              raise ValueError('Mobile fused model payload drift')
          destination=Path('app/src/main/assets/deepfilter')/mobile['asset']
          destination.parent.mkdir(parents=True,exist_ok=True)
          destination.write_bytes(payload)
          for name in ('LICENSE','LICENSE-APACHE','LICENSE-MIT'):
              (destination.parent/('mobile-'+name)).write_bytes((Path('out/mobile-model')/name).read_bytes())
          PY
      - name: Preserve locked dependency attribution
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 metadata --locked --manifest-path native/deepfilter-runtime/Cargo.toml --format-version 1 > out/runtime-metadata.json
          python3 tools/deepfilter/prepare_licenses.py out/runtime-metadata.json app/src/main/assets/deepfilter
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - name: Prepare build SDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/swift
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36.1' 'ndk;28.0.13004108'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile, lint and assemble actual optimized Android app
        env:
          INCOMING_AUDIO_AAR: ${{ github.workspace }}/out/native/ringrtc-mock-arm64.aar
        run: |
          chmod +x gradlew
          set -o pipefail
          common=(--no-daemon --no-parallel --max-workers=1
            '-Dorg.gradle.jvmargs=-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g'
            -Pkotlin.compiler.execution.strategy=in-process
            -I tools/incoming-audio/native_override.gradle
            -PbasePackageId=com.mekromn.mollyaudio
            '-PbaseAppTitle=Molly Audio' -PbaseAppFileName=Molly-Audio)
          ./gradlew "${common[@]}" :app:lintVitalProdStoreRelease 2>&1 | tee out/mock-app-reports/lint.log
          ./gradlew "${common[@]}" :app:assembleProdStoreRelease 2>&1 | tee out/mock-app-reports/assembly.log
      - name: Verify compiled APK and local-only entry
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/prodStore/release -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" = 1
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out/mock-apk out/mock-sdk/lib64
          cp "$SDK/aapt2" "$SDK/dexdump" "$SDK/zipalign" out/mock-sdk/
          cp "$SDK/lib/apksigner.jar" out/mock-sdk/
          cp "$SDK/lib64/libc++.so" out/mock-sdk/lib64/
          python3 tools/deepfilter/finalize_models.py --input "${apks[0]}" --output out/model-complete.apk \
            --models out/reference/models --lock tools/deepfilter/models.lock.json \
            --extra-models out/mobile-model --extra-lock tools/deepfilter/mobile-model.lock.json \
            > out/mock-app-reports/models.json
          "$SDK/zipalign" -P 16 -f 4 out/model-complete.apk out/mock-apk/Molly-Audio-Mock-Call-Lab-arm64-unsigned.apk
          "$SDK/zipalign" -c -P 16 4 out/mock-apk/Molly-Audio-Mock-Call-Lab-arm64-unsigned.apk
          python3 tools/mock-call/verify_apk.py --apk out/mock-apk/Molly-Audio-Mock-Call-Lab-arm64-unsigned.apk --aar out/native/ringrtc-mock-arm64.aar --sdk "$SDK" > out/mock-app-reports/apk-verification.json
          git rev-parse HEAD > out/mock-app-reports/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: molly-mock-call-lab-unsigned
          path: out/mock-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: molly-mock-sdk-tools
          path: out/mock-sdk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-call-app-build-reports
          path: out/mock-app-reports/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mock-call-incomplete-packaging-diagnostics
          path: |
            out/mock-apk/
            out/mock-sdk/
          if-no-files-found: ignore
